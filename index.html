<!DOCTYPE html>
<html>
<head>
    <title>My First AI</title>
</head>

<body>

    <h1>My First AI Assistant</h1>

    <p>Welcome! My AI is being built.</p>

    <input type="text" id="question" placeholder="Ask me something...">

    <button id="askButton">Ask AI</button>

    <p id="answer"></p>

    <script>
        document.getElementById("askButton").onclick = function() {
            var question = document.getElementById("question").value;

            document.getElementById("answer").innerHTML =
                "You asked: " + question;
        };
    </script>

</body>
</html>
