<!DOCTYPE html>
<html>
<head>
    <title>My First AI</title>
</head>

<body>

    <h1>My First AI Assistant</h1>

    <p>Welcome! My AI is being built.</p>

    <input type="text" id="question" placeholder="Ask me something...">

    <button id="askButton">Ask AI</button>

    <p id="answer"></p>

    <script>
        document.getElementById("askButton").onclick = async function() {

    var question = document.getElementById("question").value.trim();
    var answer = document.getElementById("answer");

    if (!question) {
        answer.innerHTML = "Please ask me something.";
        return;
    }

    answer.innerHTML = "Thinking...";

    try {

        var response = await fetch("https://my-first-ai-backend.technologieshandei.workers.dev/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: question
            })
        });

        var data = await response.json();

        if (data.answer) {
            answer.innerHTML = data.answer;
        } else {
            answer.innerHTML = "Sorry, I couldn't get an answer.";
        }

    } catch (error) {

        answer.innerHTML = "Something went wrong connecting to my AI.";

    }
};
    </script>

</body>
</html>
